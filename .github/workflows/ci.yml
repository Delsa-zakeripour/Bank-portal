name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: v24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: v24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add prisma
        run: npx prisma generate

      - name: Typescript check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: v24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: vitest
        run: npm test

  docker:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/delsa-zakeripour/bank-portal:latest
            ghcr.io/delsa-zakeripour/bank-portal:${{ github.sha }}

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: v24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add prisma
        run: npx prisma generate

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:ci"
          AUTH_SECRET: ${{secrets.CI_AUTH_SECRET}}
          NEXTAUTH_SECRET: ${{secrets.CI_AUTH_SECRET}}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 7

  # migrate:
