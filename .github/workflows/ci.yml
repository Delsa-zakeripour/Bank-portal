name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: npm ci

      - name: Add prisma
        run: npx prisma generate

      - name: Typescript check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: vitest
        run: npm test

  docker:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/delsa-zakeripour/bank-portal:latest
            ghcr.io/delsa-zakeripour/bank-portal:${{ github.sha }}

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Add prisma
        run: npx prisma generate

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:ci"
          AUTH_SECRET: ${{secrets.CI_AUTH_SECRET}}
          NEXTAUTH_SECRET: ${{secrets.CI_AUTH_SECRET}}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 7


  deploy-staging:
    needs: [docker]
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  deploy-production:
    needs: [deploy-staging]
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
