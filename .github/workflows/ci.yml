name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
       - name: Test Lint
         run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps: 
      - name: Typescript check 
        run: npx tsc --noEmit

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: v24

      - name: Install dependencies
        run: npm ci

      - name: Add prisma
        run: npx prisma generate


      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:ci"
          AUTH_SECRET: "ci-not-real"
          NEXTAUTH_SECRET: "ci-not-real-secret"
  
 