name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: v24.13.0

      - name: Install prisma
        run: npx prisma generate

      - name: install dependencies
        run: npm ci

      - name: Test Lint
        run: npm run lint

      - name: Build project
        run: npm run build
