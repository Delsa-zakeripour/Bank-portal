name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
        group: deploy-${{ inputs.environment }}
        cancel-in-progress: false

    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing secrets for environment '${{ inputs.environment }}'"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/delsa-zakeripour/bank-portal:${{ github.sha }}
        run: curl -f -X POST "$DEPLOY_HOOK&imgURL=$IMAGE"
